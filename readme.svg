<text x="0" y="128" font-size="15" class="s hb"><tspan fill="#636c76">Shipping </tspan><tspan fill="#1f2328" font-weight="600">nflncr</tspan><tspan fill="#636c76">, </tspan><tspan fill="#1f2328" font-weight="600">ResumeBuddy</tspan><tspan fill="#636c76">, </tspan><tspan fill="#1f2328" font-weight="600">rep_</tspan><tspan fill="#636c76"> — automations that actually work.</tspan></text>
<line x1="0" y1="142" x2="800" y2="142" stroke="#d0d7de" stroke-width="1" class="hd"/>

