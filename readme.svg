<svg width="800" height="356" viewBox="0 0 800 356" xmlns="http://www.w3.org/2000/svg">
<defs><style>
.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.ht{opacity:0;animation:fu .4s ease .1s forwards}
.hn{opacity:0;animation:fu .5s ease .2s forwards}
.hb{opacity:0;animation:fu .4s ease .4s forwards}
.hd{opacity:0;animation:fi .3s ease .7s forwards}
.hul{animation:ul .5s ease .6s forwards}
.cur{animation:bl 1s step-end infinite}
.a1{animation:a1 14s ease-in-out forwards}
.a2{animation:a2 14s ease-in-out forwards}
.a3{animation:a3 14s ease-in-out forwards}
.a4{animation:a4 14s ease-in-out forwards}
.c1{opacity:0;animation:c1 14s ease forwards}
.c2{opacity:0;animation:c2 14s ease forwards}
.c3{opacity:0;animation:c3 14s ease forwards}
.c4{opacity:0;animation:c4 14s ease forwards}
.stk{opacity:0;animation:stk 14s ease forwards}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes ul{from{width:0}to{width:255px}}
@keyframes bl{0%,100%{opacity:1}50%{opacity:0}}
@keyframes a1{
  0%{opacity:0;transform:translate(-50px,286px)}
  7%{opacity:1;transform:translate(-50px,286px)}
  10%{transform:translate(10px,284px)}
  14%{opacity:1;transform:translate(94px,286px)}
  57%{opacity:1;transform:translate(94px,286px)}
  60%{transform:translate(120px,284px)}
  64%{opacity:0;transform:translate(860px,286px)}
  100%{opacity:0;transform:translate(860px,286px)}
}
@keyframes a2{
  0%{opacity:0;transform:translate(870px,286px)scale(-1,1)}
  18%{opacity:0;transform:translate(870px,286px)scale(-1,1)}
  19%{opacity:1;transform:translate(870px,286px)scale(-1,1)}
  23%{transform:translate(530px,284px)scale(-1,1)}
  25%{opacity:1;transform:translate(298px,286px)scale(-1,1)}
  57%{opacity:1;transform:translate(298px,286px)scale(-1,1)}
  61%{transform:translate(260px,284px)scale(-1,1)}
  65%{opacity:0;transform:translate(-200px,286px)scale(-1,1)}
  100%{opacity:0;transform:translate(-200px,286px)scale(-1,1)}
}
@keyframes a3{
  0%{opacity:0;transform:translate(-50px,286px)}
  29%{opacity:0;transform:translate(-50px,286px)}
  30%{opacity:1;transform:translate(-50px,286px)}
  34%{transform:translate(200px,284px)}
  36%{opacity:1;transform:translate(502px,286px)}
  57%{opacity:1;transform:translate(502px,286px)}
  62%{transform:translate(560px,284px)}
  66%{opacity:0;transform:translate(860px,286px)}
  100%{opacity:0;transform:translate(860px,286px)}
}
@keyframes a4{
  0%{opacity:0;transform:translate(870px,286px)scale(-1,1)}
  40%{opacity:0;transform:translate(870px,286px)scale(-1,1)}
  41%{opacity:1;transform:translate(870px,286px)scale(-1,1)}
  44%{transform:translate(760px,284px)scale(-1,1)}
  46%{opacity:1;transform:translate(706px,286px)scale(-1,1)}
