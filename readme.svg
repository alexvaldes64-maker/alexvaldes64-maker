<rect width="800" height="356" fill="#fff"/>

<text x="0" y="20" fill="#636c76" font-size="11" letter-spacing="2" class="s m ht">GTM + AI INTEGRATION · EL PASO TX → NEW YORK NY</text>
<text x="0" y="70" fill="#1f2328" font-size="46" font-weight="800" letter-spacing="-1.5" class="s hn">Alex Valdes<tspan class="cur" font-size="42" dx="3" dy="-2">|</tspan></text>
<rect x="0" y="78" height="3" width="0" rx="1.5" fill="#1f2328" class="hul"/>
