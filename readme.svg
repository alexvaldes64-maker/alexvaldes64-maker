  <!-- White background -->
  <rect width="800" height="520" class="bg"/>

  <!-- Tag -->
  <text x="0" y="22" class="tag fade1">GTM + AI INTEGRATION · EL PASO TX → NEW YORK NY</text>

  <!-- Name + cursor -->
  <text x="0" y="76" class="name fade2">Alex Valdes<tspan class="cursor cursor-blink" dx="4" dy="-2" font-size="36">|</tspan></text>

  <!-- Underline -->
  <rect x="0" y="84" height="3" rx="1.5" class="underline-bar underline-draw"/>

  <!-- Bio -->
  <text x="0" y="114" class="bio fade3">I build AI-native products and GTM systems from scratch.</text>
  <text x="0" y="132" class="fade3">
    <tspan class="bio">Shipping </tspan><tspan class="bio-bold">nflncr</tspan><tspan class="bio">, </tspan><tspan class="bio-bold">ResumeBuddy</tspan><tspan class="bio">, </tspan><tspan class="bio-bold">rep_</tspan><tspan class="bio"> and automations that actually work.</tspan>
  </text>

