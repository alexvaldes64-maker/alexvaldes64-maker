  <!-- Links -->
  <text x="0"   y="476" class="link-muted fade14">✉ alexvaldes64@gmail.com</text>
  <text x="220" y="476" class="link fade14">getnflncr.com</text>
  <text x="330" y="476" class="link fade14">resume-buddy-xi.vercel.app</text>
  <text x="570" y="476" class="link fade14">linkedin · alexvaldes14</text>
</svg>
