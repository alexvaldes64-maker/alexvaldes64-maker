  <text x="14" y="270" class="card-label fade7">RFP AI</text>
  <text x="14" y="286" class="card-sub fade7">Internal AI platform.</text>
  <text x="14" y="300" class="card-sub fade7">Automates RFP response</text>
  <text x="14" y="314" class="card-sub fade7">generation end to end.</text>

  <!-- Card 2: nflncr -->
  <rect x="204" y="248" width="188" height="82" rx="6" class="currently-border fade8"/>
  <text x="218" y="270" class="card-label fade8">nflncr</text>
  <text x="218" y="286" class="card-sub fade8">AI synthetic talent studio.</text>
  <text x="218" y="300" class="card-sub fade8">4K UGC in under 4 hours.</text>
  <text x="218" y="314" class="card-sub fade8">No human creators needed.</text>

  <!-- Card 3: ResumeBuddy -->
  <rect x="408" y="248" width="188" height="82" rx="6" class="currently-border fade9"/>
  <text x="422" y="270" class="card-label fade9">ResumeBuddy</text>
  <text x="422" y="286" class="card-sub fade9">AI career assistant.</text>
  <text x="422" y="300" class="card-sub fade9">Resume analysis and role</text>
  <text x="422" y="314" class="card-sub fade9">matching for students.</text>

  <!-- Card 4: rep_ -->
  <rect x="612" y="248" width="188" height="82" rx="6" class="currently-border fade10"/>
  <text x="626" y="270" class="card-label fade10">rep_</text>
  <text x="626" y="286" class="card-sub fade10">iOS fitness app.</text>
  <text x="626" y="300" class="card-sub fade10">WHOOP API + AI program</text>
  <text x="626" y="314" class="card-sub fade10">gen. Expo / React Native.</text>

  <!-- STACK -->
  <text x="0" y="358" class="section fade11">STACK</text>

  <!-- Chips row 1 -->
  <rect x="0"   y="366" width="62"  height="20" rx="10" class="chip-bg fade12"/>
  <text x="31"  y="380" text-anchor="middle" class="chip-text fade12">Next.js</text>

  <rect x="70"  y="366" width="80"  height="20" rx="10" class="chip-bg fade12"/>
  <text x="110" y="380" text-anchor="middle" class="chip-text fade12">TypeScript</text>

  <rect x="158" y="366" width="96"  height="20" rx="10" class="chip-bg fade12"/>
  <text x="206" y="380" text-anchor="middle" class="chip-text fade12">React Native</text>

  <rect x="262" y="366" width="68"  height="20" rx="10" class="chip-bg fade12"/>
  <text x="296" y="380" text-anchor="middle" class="chip-text fade12">Supabase</text>

  <rect x="338" y="366" width="60"  height="20" rx="10" class="chip-bg fade12"/>
  <text x="368" y="380" text-anchor="middle" class="chip-text fade12">Firebase</text>

  <rect x="406" y="366" width="40"  height="20" rx="10" class="chip-bg fade12"/>
  <text x="426" y="380" text-anchor="middle" class="chip-text fade12">n8n</text>

  <rect x="454" y="366" width="40"  height="20" rx="10" class="chip-bg fade12"/>
  <text x="474" y="380" text-anchor="middle" class="chip-text fade12">Clay</text>

  <rect x="502" y="366" width="50"  height="20" rx="10" class="chip-bg fade12"/>
  <text x="527" y="380" text-anchor="middle" class="chip-text fade12">Figma</text>

  <rect x="560" y="366" width="56"  height="20" rx="10" class="chip-bg fade12"/>
  <text x="588" y="380" text-anchor="middle" class="chip-text fade12">Framer</text>

  <rect x="624" y="366" width="72"  height="20" rx="10" class="chip-bg fade12"/>
  <text x="660" y="380" text-anchor="middle" class="chip-text fade12">REST APIs</text>

  <rect x="704" y="366" width="58"  height="20" rx="10" class="chip-bg fade12"/>
  <text x="733" y="380" text-anchor="middle" class="chip-text fade12">HubSpot</text>

  <!-- Divider -->
  <line x1="0" y1="404" x2="800" y2="404" class="divider fade4"/>

