<svg width="800" height="520" viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 42px; font-weight: 800; fill: #1f2328; letter-spacing: -1.5px; }
      .tag { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace; font-size: 11px; fill: #656d76; letter-spacing: 2px; }
      .bio { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; fill: #656d76; }
      .bio-bold { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; font-weight: 600; }
      .section { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace; font-size: 10px; fill: #9198a1; letter-spacing: 2.5px; }
      .card-bg { fill: #f6f8fa; }
      .card-border { fill: none; stroke: #d0d7de; stroke-width: 1; }
      .card-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #1f2328; }
      .card-sub { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace; font-size: 9.5px; fill: #656d76; }
      .chip-bg { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
      .chip-text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace; font-size: 10px; fill: #1f2328; }
      .divider { stroke: #d0d7de; stroke-width: 1; }
      .stat-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 800; fill: #1f2328; }
      .stat-label { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace; font-size: 9px; fill: #9198a1; letter-spacing: 1.5px; }
      .link { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace; font-size: 10px; fill: #0969da; }
      .link-muted { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace; font-size: 10px; fill: #656d76; }
      .dot-green { fill: #1a7f37; }
      .underline-bar { fill: #1f2328; }
      .currently-border { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
      .currently-text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace; font-size: 11px; fill: #656d76; }
      .currently-bold { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace; font-size: 11px; fill: #1f2328; font-weight: 600; }
      .cursor { fill: #1f2328; }

      .fade1  { opacity: 0; animation: fadeUp 0.5s ease 0.05s forwards; }
      .fade2  { opacity: 0; animation: fadeUp 0.5s ease 0.15s forwards; }
      .fade3  { opacity: 0; animation: fadeUp 0.5s ease 0.28s forwards; }
      .fade4  { opacity: 0; animation: fadeIn 0.4s ease 0.42s forwards; }
      .fade5  { opacity: 0; animation: fadeUp 0.4s ease 0.55s forwards; }
      .fade6  { opacity: 0; animation: fadeUp 0.4s ease 0.62s forwards; }
      .fade7  { opacity: 0; animation: fadeUp 0.4s ease 0.70s forwards; }
      .fade8  { opacity: 0; animation: fadeUp 0.4s ease 0.78s forwards; }
      .fade9  { opacity: 0; animation: fadeUp 0.4s ease 0.86s forwards; }
      .fade10 { opacity: 0; animation: fadeUp 0.4s ease 0.88s forwards; }
      .fade11 { opacity: 0; animation: fadeUp 0.4s ease 0.96s forwards; }
      .fade12 { opacity: 0; animation: fadeUp 0.4s ease 1.04s forwards; }
      .fade13 { opacity: 0; animation: fadeUp 0.4s ease 1.12s forwards; }
      .fade14 { opacity: 0; animation: fadeUp 0.4s ease 1.20s forwards; }

      .underline-draw { width: 0; animation: drawLine 0.55s ease 0.65s forwards; }
      .cursor-blink   { animation: blink 1s step-end infinite; }
      .dot-pulse      { animation: pulse 2s ease-in-out 1.2s infinite; }

      @keyframes fadeUp  { from { opacity:0; transform:translateY(7px); } to { opacity:1; transform:translateY(0); } }
      @keyframes fadeIn  { from { opacity:0; } to { opacity:1; } }
      @keyframes drawLine{ from { width:0; } to { width:230px; } }
      @keyframes blink   { 0%,100%{ opacity:1; } 50%{ opacity:0; } }
      @keyframes pulse   { 0%,100%{ r:3.5; opacity:1; } 50%{ r:5.5; opacity:0.3; } }
