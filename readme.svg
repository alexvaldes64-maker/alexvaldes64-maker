  63%{transform:translate(740px,284px)scale(-1,1)}
  67%{opacity:0;transform:translate(-200px,286px)scale(-1,1)}
  100%{opacity:0;transform:translate(-200px,286px)scale(-1,1)}
}
@keyframes c1{0%,15%{opacity:0}16%,100%{opacity:1}}
@keyframes c2{0%,26%{opacity:0}27%,100%{opacity:1}}
@keyframes c3{0%,37%{opacity:0}38%,100%{opacity:1}}
@keyframes c4{0%,47%{opacity:0}48%,100%{opacity:1}}
@keyframes stk{0%,72%{opacity:0}80%,100%{opacity:1}}
