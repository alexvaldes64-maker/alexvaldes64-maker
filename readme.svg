  <text x="218" y="204" fill="#636c76" font-size="10" class="m">4K UGC in under 4 hours.</text>
  <text x="218" y="218" fill="#636c76" font-size="10" class="m">No human creators needed.</text>
  <text x="218" y="232" fill="#636c76" font-size="10" class="m">getnflncr.com</text>
</g>
