  <circle cx="18" cy="185" r="3.5" class="dot-green dot-pulse fade5"/>
  <text x="34" y="180" class="currently-bold fade5">Currently: <tspan class="currently-text">Handle (usehandle.ai) biz-dev sprint — a16z-backed quoting automation for brokers.</tspan></text>
  <text x="34" y="198" class="currently-text fade5">Building <tspan class="currently-bold">nflncr</tspan><tspan class="currently-text">, an AI synthetic talent studio for brand-ready 4K UGC in under 4 hours.</tspan></text>

